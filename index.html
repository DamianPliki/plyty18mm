    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      line-height: 1.5;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 20px auto;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #1e293b;
    }

    p.subtitle {
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    .search-container {
      position: sticky;
      top: 15px;
      z-index: 100;
      max-width: 600px;
      margin: 0 auto 10px auto;
      background: var(--card-bg);
      padding: 10px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 40px 12px 16px;
      font-size: 1rem;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
    }

    .clear-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      font-size: 1.2rem;
      color: #94a3b8;
      cursor: pointer;
      display: none;
    }

    .clear-btn:hover {
      color: #334155;
    }

    .tags {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .tag {
      background: #e2e8f0;
      border: none;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      color: #334155;
      cursor: pointer;
      transition: background 0.2s;
    }

    .tag:hover {
      background: var(--accent-color);
      color: #fff;
    }

    .counter {
      text-align: center;
      font-size: 0.85rem;
      color: #64748b;
      margin: 15px 0 25px 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .img-wrapper {
      width: 100%;
      height: 180px;
      background-color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .card:hover .img-wrapper img {
      transform: scale(1.05);
    }

    .card-content {
      padding: 12px 15px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #0f172a;
      line-height: 1.35;
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px 20px;
      color: #64748b;
      font-size: 1.1rem;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 23, 42, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
      backdrop-filter: blur(4px);
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #ffffff;
      border-radius: 12px;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    .modal-body {
      flex-grow: 1;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      padding: 10px;
    }

    .modal-body img {
      max-width: 100%;
      max-height: 70vh;
      object-fit: contain;
      border-radius: 6px;
    }

    .modal-footer {
      padding: 15px 20px;
      background: #ffffff;
      border-top: 1px solid var(--border-color);
      text-align: center;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #0f172a;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 2rem;
      color: #64748b;
      cursor: pointer;
      line-height: 1;
      z-index: 1010;
      background: none;
      border: none;
    }

    .close-btn:hover {
      color: #0f172a;
    }
  </style>
</head>

   const grid = document.getElementById('boardsGrid');
    const searchInput = document.getElementById('searchInput');
    const clearInputBtn = document.getElementById('clearInput');
    const counter = document.getElementById('counter');

    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImg');
    const modalTitle = document.getElementById('modalTitle');
    const closeModal = document.getElementById('closeModal');

    const placeholderImg = 'https://via.placeholder.com/300x200?text=Brak+obrazu';

    function getImagePath(board) {
      return board.file ? `img/${board.folder}/${board.file}` : placeholderImg;
    }

    function displayBoards(items) {
      grid.innerHTML = '';
      
      if (items.length === 0) {
        const noRes = document.createElement('div');
        noRes.className = 'no-results';
        noRes.textContent = 'Brak wyników spełniających kryteria wyszukiwania.';
        grid.appendChild(noRes);
        counter.textContent = 'Znaleziono: 0';
        return;
      }

      const fragment = document.createDocumentFragment();

      items.forEach(board => {
        const imgPath = getImagePath(board);
        
        const card = document.createElement('div');
        card.className = 'card';

        const imgWrapper = document.createElement('div');
        imgWrapper.className = 'img-wrapper';

        const img = document.createElement('img');
        img.src = imgPath;
        img.alt = board.name;
        img.loading = 'lazy';
        img.onerror = () => { img.src = placeholderImg; };

        imgWrapper.appendChild(img);

        const cardContent = document.createElement('div');
        cardContent.className = 'card-content';

        const cardTitle = document.createElement('div');
        cardTitle.className = 'card-title';
        cardTitle.textContent = board.name;

        cardContent.appendChild(cardTitle);
        card.appendChild(imgWrapper);
        card.appendChild(cardContent);

        card.addEventListener('click', () => {
          modalImg.src = imgPath;
          modalTitle.textContent = board.name;
          modal.classList.add('active');
        });

        fragment.appendChild(card);
      });

      grid.appendChild(fragment);
      counter.textContent = `Wyświetlono: ${items.length} z ${boards.length}`;
    }

   // Funkcja usuwająca polskie znaki oraz ujednolicająca nazwy (np. Viking/Wiking)
    function removeAccents(text) {
      let cleaned = text
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/ł/g, 'l')
        .replace(/Ł/g, 'L')
        .toLowerCase();

      // Zamienniki nazw i przedrostków (angielskie <-> polskie)
      cleaned = cleaned
        .replace(/viking/g, 'wiking')
        .replace(/york/g, 'jork')
        .replace(/cashmir/g, 'kaszmir')
        .replace(/cremona/g, 'kremona')
        .replace(/craft/g, 'kraft')
        .replace(/venge/g, 'wenge');

      return cleaned;
    }

    // Debounce do filtrowania
    let debounceTimer;
    function filterBoards(query) {
      const cleanQuery = removeAccents(query.trim());
      clearInputBtn.style.display = cleanQuery ? 'block' : 'none';

      const filtered = boards.filter(board => {
        const cleanName = removeAccents(board.name);
        return cleanName.includes(cleanQuery);
      });
      
      displayBoards(filtered);
    }

    searchInput.addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => filterBoards(e.target.value), 150);
    });

    clearInputBtn.addEventListener('click', () => {
      searchInput.value = '';
      filterBoards('');
      searchInput.focus();
    });

    // Filtrowanie z tagów
    document.querySelectorAll('.tag').forEach(tag => {
      tag.addEventListener('click', () => {
        const value = tag.getAttribute('data-filter');
        searchInput.value = value;
        filterBoards(value);
      });
    });

    // Zamykanie modala
    closeModal.addEventListener('click', () => modal.classList.remove('active'));
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        modal.classList.remove('active');
      }
    });

    // Start aplikacji
    displayBoards(boards);
  </script>
